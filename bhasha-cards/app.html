<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhasha Cards</title>
<meta name="description" content="Make flash cards in your family's language: Hindi, Tamil, Gujarati, Punjabi, Telugu, Bengali, Marathi. Print them or practise on your phone.">
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Baloo+Bhai+2:wght@600&family=Baloo+Paaji+2:wght@600&family=Baloo+Thambi+2:wght@600&family=Baloo+Tammudu+2:wght@600&family=Baloo+Da+2:wght@600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar no-print">
  <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> Bhasha Cards</a>
  <button id="proBtn" class="pill pro-pill" type="button">✨ Go Pro</button>
</header>
<main id="view" class="no-print"></main>
<div id="print-area"></div>

<dialog id="sheet" class="sheet no-print"></dialog>
<dialog id="paywall" class="sheet no-print"></dialog>
<div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
</script>

</html>
